name: Unpack Pathways v1.1.2 source

on:
  push:
    paths:
      - 'source_chunks/part04.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          cat source_chunks/part*.b64 | base64 -d > /tmp/pathways-v1.1.2-source.tar.gz
          tar -tzf /tmp/pathways-v1.1.2-source.tar.gz >/dev/null

      - name: Install Pathways source tree
        shell: bash
        run: |
          mkdir -p /tmp/pathways-src
          tar -xzf /tmp/pathways-v1.1.2-source.tar.gz -C /tmp/pathways-src
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name source_chunks -exec rm -rf {} +
          cp -a /tmp/pathways-src/. ./
          rm -rf source_chunks

      - name: Commit Pathways v1.1.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Deploy Pathways v1.1.2 source"
          git push origin HEAD:main
